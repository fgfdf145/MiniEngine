# A vehicle test track (tools/render_scenes/make_car_test_track.py) and a plain box car on its apron,
# facing +Z. Select the car and press F5 to drive it. From the apron three courses lead away:
#   x 0, ahead:      suspension - speed humps, washboard, bumps under one side then the other, a kerb, a jump
#   x -34, to the left: body attitude - 6 and 12 degree climbs, three waves, a bank swinging +12 / -12 degrees
#   x 28..60, right: grip - eight 4 m lanes (asphalt, wet, grass, dirt, gravel, mud, snow, ice), then a
#                    split-friction road (asphalt left, ice right) and asphalt / ice / gravel bands
# Each surface collides at its own friction (1.0 dry asphalt down to 0.1 ice). Backspace puts the car back.
