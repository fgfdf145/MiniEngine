# A GTA 3D-era (III / Vice City / San Andreas) suspension bridge, for joining one part of a map to another.
# It runs along +X: 660 m long, four lanes (3.5 m each) and two 2.5 m sidewalks. The deck is 20 m above
# its ends and the towers rise to about 67 m. The road ends in 10 m of flat road at y = 0, the west end at
# the model's origin and the east end at (660, 0, 0), so the bridge is placed by putting its origin on the
# end of a road and turning it about Y to face the other side. It has no collision model of its own: what
# it draws collides, the alpha-tested railings included.
# The bridge comes from the Blender generator gta_bridge.py (Blender text block of the same name); the
# car is imported from Assetto Corsa at assets/skyline_r34_vspec (not in git). The Skyline stands on the
# west end facing east (+X), in the inside lane on the right; the grounds are the asphalt test plane,
# 2 cm under the road at both ends. Run from the repository's root.
