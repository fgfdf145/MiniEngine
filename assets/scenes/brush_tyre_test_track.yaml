# The brush tyre's test ground: the Nissan GT-R GT3 (Assetto Corsa data, multibody suspension, hub masses)
# on the vehicle test track (tools/render_scenes/make_car_test_track.py), on its apron facing the courses.
# The car is selected: open the Vehicle panel, keep "Tyre Model" on "Brush, flexible carcass" and press
# Drive (or F5); switch it to "Physics engine" for the old tyre. The panel's table shows each tyre's load,
# forces, sliding share and carcass deflection. Backspace puts the car back.
#   ahead (x 0):        speed humps, washboard, one-sided bumps, a kerb, a jump
#   left (x -34):       6 and 12 degree climbs (stop and pull away on them), waves, a +/-12 degree bank
#   right (x 28..60):   eight 4 m grip lanes (asphalt 1.0 ... ice 0.1), a split-friction road
#                       (asphalt left, ice right: brake on it), asphalt / ice / gravel bands
# Needs assets/models/car_test_track (scripts/install-render-scenes) and the car imported from
# Assetto Corsa's ks_nissan_gtr_gt3 at assets/nissan_gtr_gt3 (not in git). Run from the repository's root.
