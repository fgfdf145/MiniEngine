# San Andreas (GTA SA) as five glTF models, one per region of the game's map: Los Santos, San
# Fierro, Las Venturas, the countryside and the sea bed. The map's own world coordinates are kept, so
# the models stand at the origin and line up with each other. Converted from the game's files by the
# tools in C:\Project\GTASA MAP (tools/engine_bundle.py) and imported to assets/models/gtasa_<region>
# (not in git). glTF is Y-up: a game position (x, y, z) is (x, z, -y) here, and the game's north is -Z.
scene:
  version: 3
  selected_entity_uuid: ""
  selected_entity: -1
