# San Andreas (GTA SA), streamed: the drawn map comes in 500 m cells from
# assets/models/gtasa_stream/gtasa.stream.yaml, high detail within 700 m of the camera (or the car being
# driven) and the game's own LOD models elsewhere (docs/design/2026-10-05-world-streaming-design.md). What
# is always loaded: the game's collision (one model per region of the map: Los Santos, San Fierro, Las
# Venturas, the countryside and the sea bed), its water (data/water.dat, with open sea beyond the map;
# cars float, fill and sink below it), the Skyline R34 on Grove Street facing west, and the sun.
# Everything comes from the converter in C:\Project\GTASA MAP (tools/stream_bundle.py, tools/water.py)
# and is not in git; the car is imported from Assetto Corsa at assets/skyline_r34_vspec.
# glTF is Y-up: a game position (x, y, z) is (x, z, -y) here, and the game's north is -Z.
