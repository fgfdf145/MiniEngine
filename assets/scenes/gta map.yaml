# The three GTA maps side by side, streamed: San Andreas in the middle, Liberty City (GTA III) to its
# west and Vice City to its east, with open sea between. A map's game position (x, y, z) is moved by its
# offset (C:\Project\GTASA MAP\tools\gta_map.py, world_offset): San Andreas (0, 0, 0), Liberty City
# (-6000, 0, 0), Vice City (6000, 0, -6), which also brings Vice City's sea, 6 m up in its game, to 0
# like the others'. glTF is Y-up: a moved game position (x, y, z) is (x, z, -y) here, and north is -Z.
# Here Liberty City's Portland is about (-5090, 9, 230) and Staunton Island (-5760, 16, 180); Vice City's
# Ocean Drive (6250, 5, 1260) and Downtown (5310, 5, -1280).
#
# The drawn maps come in 500 m cells from one streaming manifest per game (assets/models/gtasa_stream,
# gta3_stream, gtavc_stream), high detail within 700 m of the camera (or the car being driven) and the
# games' own LOD models elsewhere (docs/design/2026-10-05-world-streaming-design.md). What is always
# loaded: each game's collision (San Andreas one model per region: Los Santos, San Fierro, Las Venturas,
# the countryside and the sea bed; Liberty City and Vice City one each), the water of all three
# (SA's data/water.dat, III and VC's data/waterpro.dat, open sea everywhere else; cars float, fill and
# sink below it, but not in a tunnel under it), the Skyline R34 on Grove Street facing west, and the sun.
# In the middle of the Grove Street cul-de-sac (game (2485, -1668), flat road at 12.344 m) stands the
# seven-post rig of suspension_rig.yaml, turned to face west, with a second R34 on its pads: select that car and open
# Window > Suspension Rigs for its Live Rig tab. The driven car stays the first R34 in the list.
# Two more R34s face west on straight roads: in Liberty City's Portland (game (1061.2, -631.8), road at
# 13.78 m) and in Vice City (game (-379.5, -479), road at 4.04 m after the offset).
# Everything comes from the converter in C:\Project\GTASA MAP (tools/stream_bundle.py with GTA_GAME=sa,
# iii or vc; tools/water.py) and is not in git; the car is imported from Assetto Corsa at
# assets/skyline_r34_vspec. The minimap is the three games' radar maps placed the same way
# (tools/world_radar.py -> out/gta_radar.png, copied to assets/maps/gta_radar.png, also not in git).
