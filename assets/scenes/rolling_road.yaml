# The Nissan Skyline R34 V-Spec on gently undulating ground (a few centimetres: swells
# that heave and pitch the body, shorter waves that move the wheels, crests tilted across the road
# so the body rolls too), for testing the suspension by driving. The car stands on the flat start, facing +Z.
# The ground comes from tools/render_scenes/make_rolling_road.py. Needs the car imported from Assetto
# Corsa at assets/skyline_r34_vspec (not in git), run from the repository's root.
