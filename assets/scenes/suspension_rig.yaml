# The Nissan Skyline R34 V-Spec on a seven-post rig: four wheel pads and three aero loaders on a base
# plate, on an asphalt ground. The car is selected, so Window > Suspension Rigs (or the Vehicle panel's
# button) loads it at once; its Live Rig tab runs the seven-post rig and moves the car, its wheels, the
# pads ("Wheel pad FL"...) and the loaders ("Aero loader ..."). Driving it from here drops it onto the
# pads, and off them onto the asphalt.
# The pads sit under the car's wheel centres; the car stands with its tyres (radius 0.3266 m, wheel
# centres 0.326 m up in the model) on the pads' tops at 0.65 m.
# Needs the car imported from Assetto Corsa at assets/skyline_r34_vspec (not in git: the game's content)
# and the ground at assets/models/asphalt_ground (tests/fixtures/render_scenes/models/asphalt_ground,
# from tools/render_scenes/make_car_test_track.py), run from the repository's root.
