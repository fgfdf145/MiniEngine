# The Nissan GT-R GT3 on a seven-post rig: four wheel pads and three aero loaders on a base plate.
# The car is selected, so Window > Suspension Rigs (or the Vehicle panel's button) loads it at once;
# its Live Rig tab runs the seven-post rig and moves the car, its wheels, the pads ("Wheel pad FL"...)
# and the loaders ("Aero loader ..."). Driving it from here drops it onto the pads.
# Needs the car imported from Assetto Corsa's ks_nissan_gtr_gt3 at assets/nissan_gtr_gt3 (not in git:
# the game's content), run from the repository's root.
