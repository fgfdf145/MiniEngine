# BeamNG.drive's Grid Map v2 (levels/gridmap_v2), for testing the suspension on BeamNG's own test strips.
# The map comes from tools/beamng/bng_build.py (python tools/beamng/bng_build.py gridmap_v2 --install <checkout>),
# which reads the game's zips and writes assets/models/beamng_gridmap_v2 (not in git): every static shape at
# its highest detail, the terrain, BeamNG's collision with its ground models' grip, and the water block.
# BeamNG's coordinates are kept: a BeamNG position (x, y, z) is (x, z, -y) here, north is -Z and the grid
# floor is at 100 m.
# The Skyline R34 V-Spec stands on BeamNG's spawn_suspension, facing north into the suspension zone. Its
# test strips run north from BeamNG y 68 to 212 (here z -68 to -212), side by side at BeamNG x: stones 12-20,
# sine waves 24-32, potholes 36-44, impact bumps 48-52, cobblestones 56-62, off-road squares 66-72, off-road
# sine 76-82, logs 86-92, triangles 96-100, blocks 104-110, a drop 114-120, and a rough real road 128-136
# (y -16 to 224). Speed bumps and kerbs lie west of x 0. Needs the car imported from Assetto Corsa at
# assets/skyline_r34_vspec (not in git); Yuki (assets/Yuki, not in git either) drives it.
